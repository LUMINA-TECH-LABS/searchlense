name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Show package version
        run: python -c "import searchlense; print(searchlense.__version__)"

      - name: Run tests
        run: pytest -q

  lint:
    name: Import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Import all modules
        run: |
          python -c "import searchlense"
          python -c "import searchlense.bridge"
          python -c "import searchlense.events"
          python -c "import searchlense.ledger"
          python -c "import searchlense.controller"
          python -c "import searchlense.control"
          python -c "import searchlense.session"
          python -c "import searchlense.adapters"
          python -c "import searchlense.renderers"
